<div class="commander-background" [inert]="modalOpen" [attr.aria-hidden]="modalOpen ? 'true' : null">
  <bm-connection-bar [profile]="profile" [password]="password" [connected]="connected" [busy]="busy" [logoUrl]="logoUrl"
    (profileChange)="updateProfile($event)" (passwordChange)="password = $event"
    (connectRequested)="connect()" (disconnectRequested)="disconnect()"></bm-connection-bar>

  <main class="commander">
    <bm-file-pane #localPane pane="local" [active]="activePane === 'local'" [connected]="connected" [loading]="localLoading" [path]="localPath"
      [entries]="filteredLocalEntries" [selectedPaths]="localSelection" [search]="localSearch" [sort]="localSort"
      (paneActivated)="activePane = $event" (refreshRequested)="refresh($event)" (parentRequested)="parent($event)"
      (pathSelected)="navigate($event.pane, $event.path)" (searchChanged)="updateSearch($event.pane, $event.value)"
      (sortChanged)="toggleSort($event.pane, $event.column)" (itemActionRequested)="handleFileAction($event.pane, $event.entry, $event.open)"
      (copyPathRequested)="copyPath($event.pane, $event.path, $event.relative)"></bm-file-pane>

    <bm-file-pane #remotePane pane="remote" [active]="activePane === 'remote'" [connected]="connected" [loading]="remoteLoading" [path]="remotePath"
      [entries]="filteredRemoteEntries" [selectedPaths]="remoteSelection" [search]="remoteSearch" [sort]="remoteSort"
      (paneActivated)="activePane = $event" (refreshRequested)="refresh($event)" (parentRequested)="parent($event)"
      (pathSelected)="navigate($event.pane, $event.path)" (searchChanged)="updateSearch($event.pane, $event.value)"
      (sortChanged)="toggleSort($event.pane, $event.column)" (itemActionRequested)="handleFileAction($event.pane, $event.entry, $event.open)"
      (copyPathRequested)="copyPath($event.pane, $event.path, $event.relative)"></bm-file-pane>
  </main>

  <bm-commander-footer [status]="status" [error]="error" [canView]="canOpen(activePane)" [canCopy]="canCopy(activePane)"
    [canCreateFolder]="activePane !== 'remote' || connected" [canDelete]="canDelete(activePane)"
    (viewRequested)="openSelected(activePane)" (copyRequested)="copySelected()"
    (createFolderRequested)="createFolder(activePane)" (deleteRequested)="deleteSelected()"></bm-commander-footer>
</div>

@if (copyProgress; as transfer) { <bm-copy-progress [progress]="transfer"></bm-copy-progress> }

@if (errorMessage) {
  <bm-error-dialog [title]="errorTitle" [message]="errorMessage" [hint]="errorHint" (dismissed)="dismissError()"></bm-error-dialog>
}
